<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Measured Impact — Discover Charities & Grassroots Projects</title>
  <!-- Custom SVG Favicon: United Hands Beneath a Rainforest Canopy -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23FFF4EA'/%3E%3Cpath d='M12 31c0-11 9-19 20-19s20 8 20 19c0 3-2 5-5 5H17c-3 0-5-2-5-5z' fill='%2310B981'/%3E%3Ccircle cx='22' cy='25' r='8' fill='%23059669'/%3E%3Ccircle cx='42' cy='25' r='8' fill='%2334D399'/%3E%3Ccircle cx='32' cy='21' r='9' fill='%2310B981'/%3E%3Cpath d='M29 33h6v10h-6z' fill='%23B45309'/%3E%3Cpath d='M16 49c3-5 8-7 16-7s13 2 16 7' stroke='%23FF6B4A' stroke-width='4.5' stroke-linecap='round' fill='none'/%3E%3Cpath d='M21 53c3-4 6-5 11-5s8 1 11 5' stroke='%23FFB020' stroke-width='4' stroke-linecap='round' fill='none'/%3E%3C/svg%3E" />
  
  <!-- Google Fonts: Plus Jakarta Sans & Inter for warm, modern legibility -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Chart.js CDN for Interactive Dashboard Visualizations -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

  <!-- Tailwind Configuration for Custom Warm Palette & Fonts -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Plus Jakarta Sans', 'sans-serif'],
          },
          colors: {
            base: '#FFFFFF',
            ivory: '#FFFBF7',
            ivoryDark: '#FFF4EA',
            coral: {
              DEFAULT: '#FF6B4A',
              hover: '#F25533',
              light: '#FFF0EC',
            },
            amberWarm: {
              DEFAULT: '#FFB020',
              light: '#FFF8EB',
              dark: '#D98A00',
            },
            mint: {
              DEFAULT: '#10B981',
              light: '#ECFDF5',
            },
            charcoal: {
              DEFAULT: '#1E293B',
              muted: '#64748B',
            }
          },
          boxShadow: {
            'warm': '0 10px 30px -5px rgba(255, 107, 74, 0.12), 0 4px 12px -2px rgba(30, 41, 59, 0.04)',
            'warm-lg': '0 20px 40px -10px rgba(255, 107, 74, 0.18), 0 8px 20px -4px rgba(30, 41, 59, 0.06)',
          }
        }
      }
    }
  </script>

  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #FFFBF7;
    }
    ::-webkit-scrollbar-thumb {
      background: #FFD4C9;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #FF6B4A;
    }

    /* Hide scrollbar for horizontal pill container on mobile */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* --- FANCY FLY-IN & FLY-OUT ANIMATIONS --- */
    
    /* 1. Card Staggered Upward Fly-In */
    @keyframes flyInUp {
      0% {
        opacity: 0;
        transform: translateY(32px) scale(0.96);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* 2. Grid Container Fly-Out (when switching filters/tabs) */
    @keyframes flyOutDown {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(20px) scale(0.97);
      }
    }

    /* 3. Hero Side Fly-Ins */
    @keyframes flyInLeft {
      0% {
        opacity: 0;
        transform: translateX(-36px);
      }
      100% {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes flyInRight {
      0% {
        opacity: 0;
        transform: translateX(36px);
      }
      100% {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* 4. Subtle Floating Ambient Blob */
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(3deg); }
    }

    .animate-fly-in-left {
      animation: flyInLeft 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .animate-fly-in-right {
      animation: flyInRight 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .animate-float {
      animation: floatSlow 7s ease-in-out infinite;
    }

    /* Card initial hidden state before IntersectionObserver triggers */
    .charity-card {
      opacity: 0;
      transform: translateY(32px) scale(0.96);
      will-change: transform, opacity;
    }

    .charity-card.is-visible {
      animation: flyInUp 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .grid-fly-out {
      animation: flyOutDown 0.28s cubic-bezier(0.4, 0, 1, 1) forwards !important;
    }

    /* Dashboard Panel Staggered Fly-In */
    .dash-widget {
      opacity: 0;
      transform: translateY(28px) scale(0.97);
      will-change: transform, opacity;
    }
    .dash-widget.is-visible {
      animation: flyInUp 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* View Switching Transitions */
    .view-fly-out {
      animation: flyOutDown 0.25s cubic-bezier(0.4, 0, 1, 1) forwards;
    }
    .view-fly-in {
      animation: flyInUp 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* Drawer & Modal Slide Transitions */
    .drawer-backdrop {
      transition: opacity 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      <!-- Brand Logo: Measured Impact (Hands in Huddle under Rainforest Tree Canopy) -->
      <a href="#" onclick="resetAllFilters(); return false;" class="flex items-center gap-3 group focus:outline-none">
        <div class="w-11 h-11 sm:w-12 sm:h-12 rounded-2xl bg-gradient-to-br from-ivoryDark via-white to-mint-light border border-orange-200/80 flex items-center justify-center shadow-md shadow-coral/15 group-hover:scale-105 group-hover:shadow-warm transition-all shrink-0 overflow-hidden">
          <!-- Custom Inline SVG Emblem: Diverse Hands United in Huddle Beneath a Lush Rainforest Canopy -->
          <svg viewBox="0 0 64 64" class="w-9 h-9 sm:w-10 sm:h-10" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Measured Impact Logo: United hands under a rainforest tree canopy">
            <defs>
              <linearGradient id="canopyGrad" x1="10" y1="8" x2="54" y2="34" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#34D399" />
                <stop offset="50%" stop-color="#10B981" />
                <stop offset="100%" stop-color="#059669" />
              </linearGradient>
              <linearGradient id="sunGlow" x1="32" y1="6" x2="32" y2="48" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#FFB020" stop-opacity="0.35" />
                <stop offset="100%" stop-color="#FF6B4A" stop-opacity="0.05" />
              </linearGradient>
            </defs>

            <!-- Warm Sunlit Canopy Halo -->
            <circle cx="32" cy="30" r="24" fill="url(#sunGlow)" />

            <!-- Lush Rainforest Tree Canopy (Layered Emerald & Mint Foliage) -->
            <path d="M10 29C10 18.5 19.5 10 32 10C44.5 10 54 18.5 54 29C54 32.5 51 35 47.5 35H16.5C13 35 10 32.5 10 29Z" fill="url(#canopyGrad)" />
            <circle cx="20" cy="24" r="8.5" fill="#059669" opacity="0.55" />
            <circle cx="44" cy="24" r="8.5" fill="#34D399" opacity="0.65" />
            <circle cx="32" cy="18" r="9.5" fill="#10B981" />
            <!-- Sunlit Canopy Leaf Highlights -->
            <path d="M24 16C26.5 14 30 13.5 33 14.5" stroke="#ECFDF5" stroke-width="2" stroke-linecap="round" opacity="0.85" />
            <path d="M39 19C41.5 18.5 44 19.5 45.5 21.5" stroke="#ECFDF5" stroke-width="1.8" stroke-linecap="round" opacity="0.75" />

            <!-- Rainforest Tree Trunk & Spreading Branches Framing the Huddle -->
            <path d="M32 37V25M32 29L23 23M32 28L41 22" stroke="#92400E" stroke-width="2.6" stroke-linecap="round" />

            <!-- United Hands in a Circle Huddle Beneath the Canopy -->
            <!-- Left Warm Coral Arm & Hand -->
            <path d="M13 46C16.5 40.5 22 38.5 28.5 40.5" stroke="#FF6B4A" stroke-width="4.2" stroke-linecap="round" />
            <!-- Right Sunlit Amber Arm & Hand -->
            <path d="M51 46C47.5 40.5 42 38.5 35.5 40.5" stroke="#FFB020" stroke-width="4.2" stroke-linecap="round" />
            <!-- Lower Left Terracotta Hand Reaching In -->
            <path d="M19 53.5C22.5 48 27 46 32 47" stroke="#D97706" stroke-width="4" stroke-linecap="round" />
            <!-- Lower Right Deep Coral Hand Clasping Center -->
            <path d="M45 53.5C41.5 48 37 46 32 47" stroke="#F25533" stroke-width="4" stroke-linecap="round" />

            <!-- Central Clasped Huddle Unity Core -->
            <circle cx="32" cy="43.5" r="4.2" fill="#FFFBF7" stroke="#FF6B4A" stroke-width="2.2" />
            <circle cx="32" cy="43.5" r="1.6" fill="#FFB020" />
          </svg>
        </div>
        <div>
          <span class="font-display font-extrabold text-lg sm:text-xl tracking-tight text-charcoal block leading-none">
            Measured <span class="text-coral">Impact</span>
          </span>
          <span class="text-[11px] font-medium text-charcoal-muted hidden sm:block">Global Philanthropy Explorer</span>
        </div>
      </a>

      <!-- Right Controls: Mode Badge + API Keys Button -->
      <div class="flex items-center gap-2 sm:gap-3">
        <!-- Live vs Demo Indicator Pill -->
        <button 
          id="headerModeBadge"
          onclick="openApiDrawer()"
          title="Click to configure API keys or switch data mode"
          class="flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-semibold border transition-all cursor-pointer bg-amberWarm-light border-amberWarm/30 text-amberWarm-dark hover:bg-amberWarm/15">
          <span id="modeDot" class="w-2 h-2 rounded-full bg-amberWarm animate-pulse"></span>
          <span id="modeLabel">Demo Showcase</span>
        </button>

        <!-- API Keys Configuration Drawer Trigger -->
        <button 
          onclick="openApiDrawer()"
          class="flex items-center gap-2 px-3.5 sm:px-4 py-2 sm:py-2.5 rounded-full bg-charcoal text-white hover:bg-coral active:scale-95 transition-all text-xs sm:text-sm font-semibold shadow-sm cursor-pointer">
          <i data-lucide="key-round" class="w-4 h-4 text-amberWarm"></i>
          <span>API Keys</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ==================== HERO SECTION ==================== -->
  <section class="relative bg-gradient-to-b from-ivory via-ivory to-white pt-8 pb-10 sm:pt-14 sm:pb-14 overflow-hidden border-b border-orange-100/60">
    <!-- Decorative Warm Ambient Shapes -->
    <div class="pointer-events-none absolute -top-24 -right-24 w-80 h-80 rounded-full bg-gradient-to-br from-amberWarm/20 to-coral/15 blur-3xl animate-float"></div>
    <div class="pointer-events-none absolute top-20 -left-24 w-72 h-72 rounded-full bg-gradient-to-tr from-coral/15 to-mint/10 blur-3xl"></div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
      <div class="max-w-3xl mx-auto text-center">
        <!-- Top Eyebrow Pill -->
        <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-white border border-orange-200/80 shadow-sm mb-5 animate-fly-in-left">
          <span class="flex h-2 w-2 rounded-full bg-coral"></span>
          <span class="text-xs font-semibold text-charcoal tracking-wide">Powered by Every.org & GlobalGiving APIs</span>
        </div>

        <!-- Headline -->
        <h1 class="font-display font-extrabold text-3xl sm:text-5xl lg:text-[52px] text-charcoal tracking-tight leading-[1.15] mb-4 animate-fly-in-right">
          Fund verified charities &amp; <span class="text-transparent bg-clip-text bg-gradient-to-r from-coral via-[#FF8547] to-amberWarm">grassroots impact</span> worldwide.
        </h1>

        <p class="text-charcoal-muted text-base sm:text-lg max-w-2xl mx-auto mb-8 leading-relaxed animate-fly-in-left">
          Discover 501(c)(3) nonprofits and community-led projects in real time. Filter by cause, inspect live funding progress, and donate directly at the source.
        </p>

        <!-- Search Input Bar -->
        <div class="max-w-2xl mx-auto animate-fly-in-right">
          <form id="searchForm" onsubmit="handleSearchSubmit(event)" class="relative flex items-center bg-white rounded-2xl sm:rounded-full p-1.5 sm:p-2 shadow-warm border border-orange-200/70 focus-within:border-coral focus-within:ring-4 focus-within:ring-coral/10 transition-all">
            <div class="pl-3 sm:pl-4 text-coral">
              <i data-lucide="search" class="w-5 h-5"></i>
            </div>
            <input 
              type="text" 
              id="searchInput"
              placeholder="Search nonprofits, grassroots projects, countries, or causes..."
              class="w-full px-3 py-2.5 sm:py-3 text-sm sm:text-base bg-transparent text-charcoal placeholder-charcoal-muted/70 focus:outline-none"
            />
            <button 
              type="button" 
              id="clearSearchBtn"
              onclick="clearSearchInput()"
              class="hidden p-2 text-charcoal-muted hover:text-charcoal transition-colors"
              aria-label="Clear search">
              <i data-lucide="x" class="w-4 h-4"></i>
            </button>
            <button 
              type="submit"
              class="px-5 sm:px-7 py-2.5 sm:py-3 rounded-xl sm:rounded-full bg-gradient-to-r from-coral to-[#FF834A] hover:from-coral-hover hover:to-coral text-white font-semibold text-sm sm:text-base shadow-md shadow-coral/25 active:scale-95 transition-all shrink-0 cursor-pointer">
              Explore
            </button>
          </form>
        </div>
      </div>
    </div>
  </section>

  <!-- ==================== FILTER & TAB CONTROLS ==================== -->
  <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 pb-2">
    <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4 pb-4 border-b border-slate-100">
      
      <!-- Primary Navigation Tabs: Dashboard | Discover All | Nonprofits (Every.org) | Grassroots (GlobalGiving) -->
      <div class="inline-flex p-1.5 rounded-2xl bg-ivoryDark border border-orange-200/50 self-start overflow-x-auto max-w-full no-scrollbar">
        <button 
          onclick="switchView('dashboard')" 
          data-tab="dashboard"
          class="nav-tab px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all whitespace-nowrap cursor-pointer bg-white text-charcoal shadow-sm flex items-center gap-1.5">
          <i data-lucide="layout-dashboard" class="w-4 h-4 text-coral"></i>
          <span>Dashboard</span>
        </button>
        <button 
          onclick="switchView('all')" 
          data-tab="all"
          class="nav-tab px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all whitespace-nowrap cursor-pointer text-charcoal-muted hover:text-charcoal flex items-center gap-1">
          <span>Discover All</span>
          <span id="count-all" class="ml-1 px-1.5 py-0.5 text-[11px] rounded-full bg-coral/10 text-coral">0</span>
        </button>
        <button 
          onclick="switchView('every')" 
          data-tab="every"
          class="nav-tab px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all whitespace-nowrap cursor-pointer text-charcoal-muted hover:text-charcoal flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-coral"></span>
          <span>Every.org Nonprofits</span>
          <span id="count-every" class="ml-1 px-1.5 py-0.5 text-[11px] rounded-full bg-slate-200/70 text-charcoal-muted">0</span>
        </button>
        <button 
          onclick="switchView('globalgiving')" 
          data-tab="globalgiving"
          class="nav-tab px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all whitespace-nowrap cursor-pointer text-charcoal-muted hover:text-charcoal flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-amberWarm"></span>
          <span>GlobalGiving Projects</span>
          <span id="count-gg" class="ml-1 px-1.5 py-0.5 text-[11px] rounded-full bg-slate-200/70 text-charcoal-muted">0</span>
        </button>
      </div>

      <!-- Result Counter & Refresh -->
      <div class="flex items-center justify-between sm:justify-end gap-3 text-xs sm:text-sm text-charcoal-muted">
        <span id="resultsSummary">Live Philanthropy Analytics &amp; Insights</span>
        <button 
          onclick="refreshCurrentData()" 
          title="Reload feed & recalculate metrics"
          class="p-2 rounded-xl bg-ivory hover:bg-coral-light text-charcoal hover:text-coral border border-orange-100 transition-colors cursor-pointer">
          <i data-lucide="refresh-cw" id="refreshIcon" class="w-4 h-4"></i>
        </button>
      </div>
    </div>

    <!-- Warm Cause Category Pills (Shown in Directory Views) -->
    <div class="hidden py-4 flex items-center gap-2 overflow-x-auto no-scrollbar" id="causePillsContainer">
      <!-- Populated dynamically via JS -->
    </div>
  </section>

  <!-- ==================== MAIN CONTENT AREA ==================== -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 pb-20 min-h-[520px]">
    
    <!-- Optional Status / CORS Fallback Notice Banner -->
    <div id="apiNoticeBanner" class="hidden mb-6 p-4 rounded-2xl bg-amberWarm-light border border-amberWarm/40 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
      <div class="flex items-start sm:items-center gap-3">
        <div class="p-2 rounded-xl bg-amberWarm/20 text-amberWarm-dark shrink-0">
          <i data-lucide="info" class="w-5 h-5"></i>
        </div>
        <p id="apiNoticeText" class="text-xs sm:text-sm text-charcoal font-medium"></p>
      </div>
      <button onclick="openApiDrawer()" class="text-xs font-bold text-coral hover:underline shrink-0 self-end sm:self-center cursor-pointer">
        Check API Settings &rarr;
      </button>
    </div>

    <!-- ==================== VIEW 1: INTERACTIVE IMPACT DASHBOARD ==================== -->
    <div id="dashboardView" class="space-y-7">
      
      <!-- 1. Animated KPI Stat Counters Row (4 Responsive Cards) -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
        
        <!-- KPI 1: Total Active Aid Raised -->
        <div data-delay="0ms" class="dash-widget group bg-white rounded-3xl p-5 sm:p-6 border border-orange-100/90 shadow-sm hover:shadow-warm transition-all">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-bold uppercase tracking-wider text-charcoal-muted">Active Aid Raised</span>
            <div class="w-10 h-10 rounded-2xl bg-coral-light text-coral flex items-center justify-center group-hover:scale-110 transition-transform">
              <i data-lucide="dollar-sign" class="w-5 h-5"></i>
            </div>
          </div>
          <div class="font-display font-extrabold text-2xl sm:text-3xl text-charcoal tracking-tight" id="kpiRaisedValue">$0</div>
          <div class="mt-2 flex items-center gap-1.5 text-xs font-medium text-mint">
            <i data-lucide="trending-up" class="w-3.5 h-3.5"></i>
            <span id="kpiDonorsSub">Across grassroots campaigns</span>
          </div>
        </div>

        <!-- KPI 2: Total Funding Goal & Completion Rate -->
        <div data-delay="75ms" class="dash-widget group bg-white rounded-3xl p-5 sm:p-6 border border-orange-100/90 shadow-sm hover:shadow-warm transition-all">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-bold uppercase tracking-wider text-charcoal-muted">Target Goal &amp; Rate</span>
            <div class="w-10 h-10 rounded-2xl bg-amberWarm-light text-amberWarm-dark flex items-center justify-center group-hover:scale-110 transition-transform">
              <i data-lucide="target" class="w-5 h-5"></i>
            </div>
          </div>
          <div class="flex items-baseline gap-2.5">
            <span class="font-display font-extrabold text-2xl sm:text-3xl text-charcoal tracking-tight" id="kpiGoalValue">$0</span>
            <span id="kpiCompletionBadge" class="px-2 py-0.5 rounded-full text-xs font-bold bg-mint-light text-mint">0%</span>
          </div>
          <div class="mt-2.5 w-full h-2 rounded-full bg-ivoryDark overflow-hidden">
            <div id="kpiCompletionBar" class="h-full rounded-full bg-gradient-to-r from-amberWarm to-mint transition-all duration-1000" style="width: 0%"></div>
          </div>
        </div>

        <!-- KPI 3: Indexed Verified Entities -->
        <div data-delay="150ms" class="dash-widget group bg-white rounded-3xl p-5 sm:p-6 border border-orange-100/90 shadow-sm hover:shadow-warm transition-all">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-bold uppercase tracking-wider text-charcoal-muted">Indexed Entities</span>
            <div class="w-10 h-10 rounded-2xl bg-mint-light text-mint flex items-center justify-center group-hover:scale-110 transition-transform">
              <i data-lucide="building-2" class="w-5 h-5"></i>
            </div>
          </div>
          <div class="font-display font-extrabold text-2xl sm:text-3xl text-charcoal tracking-tight" id="kpiEntitiesValue">0</div>
          <div class="mt-2 flex items-center gap-2 text-xs text-charcoal-muted font-medium" id="kpiEntitiesBreakdown">
            <span>0 Every.org</span>
            <span>•</span>
            <span>0 GlobalGiving</span>
          </div>
        </div>

        <!-- KPI 4: Countries & Causes Covered -->
        <div data-delay="225ms" class="dash-widget group bg-white rounded-3xl p-5 sm:p-6 border border-orange-100/90 shadow-sm hover:shadow-warm transition-all">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-bold uppercase tracking-wider text-charcoal-muted">Global Reach</span>
            <div class="w-10 h-10 rounded-2xl bg-sky-50 text-sky-600 flex items-center justify-center group-hover:scale-110 transition-transform">
              <i data-lucide="globe-2" class="w-5 h-5"></i>
            </div>
          </div>
          <div class="flex items-baseline gap-2">
            <span class="font-display font-extrabold text-2xl sm:text-3xl text-charcoal tracking-tight" id="kpiRegionsValue">0</span>
            <span class="text-xs font-semibold text-charcoal-muted">Regions</span>
            <span class="text-charcoal-muted/40">/</span>
            <span class="font-display font-extrabold text-xl sm:text-2xl text-coral" id="kpiCausesValue">0</span>

    function setupIntersectionObserver() {
      cardObserver = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            const el = entry.target;
            const delay = el.dataset.delay || '0ms';
            el.style.animationDelay = delay;
            el.classList.add('is-visible');
            cardObserver.unobserve(el);
          }
        });
      }, {
        threshold: 0.06,
        rootMargin: '0px 0px -20px 0px'
      });
    }

    // =========================================================================
    // 4. API FETCHING & DATA ORCHESTRATION (Every.org + GlobalGiving)
    // =========================================================================
    async function loadData(animateTransition = false) {
      const grid = document.getElementById('cardsGrid');
      const loadingGrid = document.getElementById('loadingGrid');
      const emptyState = document.getElementById('emptyState');
      const noticeBanner = document.getElementById('apiNoticeBanner');
      const refreshIcon = document.getElementById('refreshIcon');

      refreshIcon.classList.add('animate-spin');
      noticeBanner.classList.add('hidden');

      if (animateTransition && state.activeTab !== 'dashboard' && grid.children.length > 0) {
        grid.classList.add('grid-fly-out');
        await new Promise(r => setTimeout(r, 240));
        grid.classList.remove('grid-fly-out');
      }

      if (state.activeTab !== 'dashboard') {
        grid.innerHTML = '';
        emptyState.classList.add('hidden');
        loadingGrid.classList.remove('hidden');
      }

      try {
        if (state.mode === 'demo') {
          // Simulate brief crisp network feel
          await new Promise(r => setTimeout(r, 220));
          state.items = [...DEMO_ITEMS];
        } else {
          // LIVE API MODE
          const liveResults = [];
          const warnings = [];
          const queryTerm = state.searchQuery.trim() || (state.categoryFilter !== 'All' ? state.categoryFilter.toLowerCase() : 'climate');

          // 1. Fetch from Every.org Charity API
          if (state.everyApiKey) {
            try {
              const everyUrl = `https://partners.every.org/v0.2/search/${encodeURIComponent(queryTerm)}?apiKey=${encodeURIComponent(state.everyApiKey)}&take=9`;
              const res = await fetch(everyUrl);
              if (!res.ok) throw new Error(`Every.org returned HTTP ${res.status}`);
              const data = await res.json();
              const nonprofits = data.nonprofits || [];
              
              nonprofits.forEach((np, idx) => {
                liveResults.push({
                  id: `every-${np.ein || np.slug || idx}`,
                  source: 'every',
                  title: np.name || 'Verified Nonprofit',
                  subtitle: np.location || '501(c)(3) Registered Charity',
                  category: state.categoryFilter !== 'All' ? state.categoryFilter : (np.tags?.[0] || 'Nonprofit'),
                  location: np.location || 'United States',
                  ein: np.ein || 'Verified 501(c)(3)',
                  coverImage: np.coverImageUrl || 'https://images.unsplash.com/photo-1532629345422-7515f3d16bb6?auto=format&fit=crop&w=900&q=80',
                  logoImage: np.logoUrl || null,
                  summary: np.description || 'Verified charitable organization listed on Every.org.',
                  fullMission: np.description || 'Support this verified nonprofit directly through Every.org with zero platform fees.',
                  tags: (np.tags && np.tags.length) ? np.tags.slice(0, 4) : ['Verified Nonprofit', 'Every.org'],
                  actionUrl: np.profileUrl || `https://www.every.org/${np.slug || ''}`,
                  funding: null
                });
              });
            } catch (err) {
              console.warn('Every.org Live Fetch Error:', err);
              warnings.push('Every.org live request could not complete (check key or browser CORS).');
            }
          } else {
            warnings.push('No Every.org API key provided.');
          }

          // 2. Fetch from GlobalGiving API
          if (state.ggApiKey) {
            try {
              const ggUrl = state.searchQuery.trim()
                ? `https://api.globalgiving.org/api/public/services/search/projects?api_key=${encodeURIComponent(state.ggApiKey)}&q=${encodeURIComponent(state.searchQuery.trim())}`
                : `https://api.globalgiving.org/api/public/projectservice/all/projects/active?api_key=${encodeURIComponent(state.ggApiKey)}`;

              const res = await fetch(ggUrl, {
                headers: { 'Accept': 'application/json' }
              });
              if (!res.ok) throw new Error(`GlobalGiving returned HTTP ${res.status}`);
              const data = await res.json();
              
              const rawProjects = data?.search?.response?.projects?.project || data?.projects?.project || [];
              const projectsArray = Array.isArray(rawProjects) ? rawProjects : [rawProjects];

              projectsArray.slice(0, 9).forEach((proj) => {
                const goal = Number(proj.goal) || 10000;
                const raised = Number(proj.funding) || 0;
                const remaining = Math.max(0, goal - raised);
                const imageUrl = proj.image?.imagelink?.find(img => img.size === 'large' || img.size === 'medium')?.url
                  || proj.imageLink
                  || 'https://images.unsplash.com/photo-1488521787991-ed7bbaae773c?auto=format&fit=crop&w=900&q=80';

                liveResults.push({
                  id: `gg-${proj.id}`,
                  source: 'globalgiving',
                  title: proj.title || 'Grassroots Community Project',
                  subtitle: proj.organization?.name ? `Led by ${proj.organization.name}` : 'GlobalGiving Vetted Project',
                  category: proj.themeName || 'Grassroots',
                  location: [proj.contactCity, proj.country].filter(Boolean).join(', ') || 'International',
                  projectId: `GG-${proj.id}`,
                  coverImage: imageUrl,
                  logoImage: null,
                  summary: proj.summary || proj.activities || 'Community-led grassroots project vetted by GlobalGiving.',
                  fullMission: `${proj.summary || ''}\n\n${proj.need || ''} ${proj.longTermImpact || ''}`.trim(),
                  tags: [proj.themeName, proj.country, 'Grassroots'].filter(Boolean),
                  actionUrl: proj.projectLink || `https://www.globalgiving.org/projects/${proj.id}/`,
                  funding: {
                    raised,
                    goal,
                    donors: Number(proj.numberOfDonations) || 0,
                    remaining
                  }
                });
              });
            } catch (err) {
              console.warn('GlobalGiving Live Fetch Error:', err);
              warnings.push('GlobalGiving live request blocked or failed (CORS or key issue).');
            }
          } else {
            warnings.push('No GlobalGiving API key provided.');
          }

          // Fallback gracefully to Demo Showcase data if live results are empty
          if (liveResults.length === 0) {
            state.items = [...DEMO_ITEMS];
            showNoticeBanner(
              `${warnings.join(' ')} Showing Demo Showcase projects so you can keep exploring seamlessly.`
            );
          } else {
            state.items = liveResults;
            if (warnings.length > 0) {
              showNoticeBanner(`Partial live feed loaded (${warnings.join(' ')})`);
            }
          }
        }
      } finally {
        loadingGrid.classList.add('hidden');
        refreshIcon.classList.remove('animate-spin');
        updateTabCounts();
        
        // Always refresh both Dashboard metrics and Directory cards cleanly
        renderDashboard(animateTransition);
        if (state.activeTab !== 'dashboard') {
          renderFilteredCards(false);
        }
      }
    }

    // =========================================================================
    // 6. DASHBOARD ANALYTICS, ANIMATED KPI COUNTERS & CHART.JS
    // =========================================================================
    function renderDashboard(retriggerAnimations = true) {
      const items = state.items;
      const ggProjects = items.filter(i => i.source === 'globalgiving' && i.funding);
      const everyOrgs = items.filter(i => i.source === 'every');

      // 1. Aggregate KPI Numbers
      const totalRaised = ggProjects.reduce((sum, p) => sum + (p.funding.raised || 0), 0);
      const totalGoal = ggProjects.reduce((sum, p) => sum + (p.funding.goal || 0), 0);
      const totalDonors = ggProjects.reduce((sum, p) => sum + (p.funding.donors || 0), 0);
      const completionRate = totalGoal > 0 ? Math.round((totalRaised / totalGoal) * 100) : 0;

      // Unique Countries/Regions & Causes
      const regionSet = new Set();
      const causeCounts = {};

      items.forEach(item => {
        // Extract country/region after comma or bullet
        const locParts = item.location.split(/[,•]/).map(s => s.trim()).filter(Boolean);
        const region = locParts[locParts.length - 1] || 'Global';
        regionSet.add(region);

        const cat = item.category || 'General';
        causeCounts[cat] = (causeCounts[cat] || 0) + 1;
      });

      const uniqueRegions = regionSet.size;
      const uniqueCauses = Object.keys(causeCounts).length;
      const topCauseEntry = Object.entries(causeCounts).sort((a, b) => b[1] - a[1])[0];

      // 2. Animate KPI Counters
      animateCounter('kpiRaisedValue', totalRaised, { prefix: '$' });
      animateCounter('kpiGoalValue', totalGoal, { prefix: '$' });
      animateCounter('kpiEntitiesValue', items.length);
      animateCounter('kpiRegionsValue', uniqueRegions);
      animateCounter('kpiCausesValue', uniqueCauses);

      document.getElementById('kpiDonorsSub').textContent = totalDonors > 0
        ? `Backed by ${totalDonors.toLocaleString()} global donors`
        : `Across ${ggProjects.length} active grassroots projects`;

      document.getElementById('kpiCompletionBadge').textContent = `${completionRate}% Funded`;
      document.getElementById('kpiCompletionBar').style.width = `${Math.min(100, completionRate)}%`;

      document.getElementById('kpiEntitiesBreakdown').innerHTML = `
        <span class="text-coral font-semibold">${everyOrgs.length} Every.org</span>
        <span>•</span>
        <span class="text-amberWarm-dark font-semibold">${ggProjects.length} GlobalGiving</span>
      `;

      document.getElementById('kpiTopCauseText').textContent = topCauseEntry
        ? `Leading sector: ${topCauseEntry[0]} (${topCauseEntry[1]} initiatives)`
        : 'Multi-sector humanitarian coverage';

      // 3. Render Charts (Chart.js)
      renderFundingBarChart(ggProjects);
      renderCauseDoughnutChart(causeCounts);

      // 4. Render Regional Aid Allocation & Project Leaderboard
      renderRegionalAllocation(items);
      renderLeaderboardTable(ggProjects);

      // 5. Trigger Staggered Fly-In on Dashboard Widgets

        document.querySelectorAll('.dash-widget').forEach(widget => {
          widget.classList.remove('is-visible');
          void widget.offsetWidth; // Force reflow
          cardObserver.observe(widget);
        });
      }

      lucide.createIcons();
    }

    function animateCounter(elementId, targetValue, options = {}) {
      const el = document.getElementById(elementId);
      if (!el) return;

      const prefix = options.prefix || '';
      const suffix = options.suffix || '';
      const duration = 900;
      const startTime = performance.now();

      function tick(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        // Ease-out cubic curve
        const eased = 1 - Math.pow(1 - progress, 3);
        const current = Math.round(targetValue * eased);
        el.textContent = `${prefix}${current.toLocaleString()}${suffix}`;

        if (progress < 1) {
          requestAnimationFrame(tick);
        } else {
          el.textContent = `${prefix}${targetValue.toLocaleString()}${suffix}`;
        }
      }
      requestAnimationFrame(tick);
    }

    function renderFundingBarChart(ggProjects) {
      const canvas = document.getElementById('fundingBarChart');
      if (!canvas || typeof Chart === 'undefined') return;

      if (fundingChartInstance) {
        fundingChartInstance.destroy();
      }

      const topProjects = [...ggProjects]
        .sort((a, b) => (b.funding.raised / b.funding.goal) - (a.funding.raised / a.funding.goal))
        .slice(0, 6);

      const labels = topProjects.map(p => p.title.length > 22 ? p.title.slice(0, 22) + '…' : p.title);
      const raisedData = topProjects.map(p => p.funding.raised);
      const remainingData = topProjects.map(p => p.funding.remaining);

      fundingChartInstance = new Chart(canvas, {
        type: 'bar',
        data: {
          labels,
          datasets: [
            {
              label: 'Amount Raised ($)',
              data: raisedData,
              backgroundColor: '#FF6B4A',
              hoverBackgroundColor: '#F25533',
              borderRadius: 8,
              borderSkipped: false,
            },
            {
              label: 'Remaining Goal ($)',
              data: remainingData,
              backgroundColor: '#FFE5D9',
              hoverBackgroundColor: '#FFD1BD',
              borderRadius: 8,
              borderSkipped: false,
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          indexAxis: 'y',
          interaction: {
            mode: 'index',
            intersect: false,
          },
          plugins: {
            legend: {
              position: 'top',
              align: 'end',
              labels: {

    function renderCauseDoughnutChart(causeCounts) {
      const canvas = document.getElementById('causeDoughnutChart');
      if (!canvas || typeof Chart === 'undefined') return;

      if (causeChartInstance) {
        causeChartInstance.destroy();
      }

      const entries = Object.entries(causeCounts).sort((a, b) => b[1] - a[1]);
      const labels = entries.map(e => e[0]);
      const values = entries.map(e => e[1]);

      // Warm, bright, distinct categorical palette
      const palette = [
        '#FF6B4A', // Coral
        '#FFB020', // Sunlit Amber
        '#10B981', // Mint
        '#38BDF8', // Sky Blue
        '#FB7185', // Warm Rose
        '#A78BFA', // Soft Violet
        '#F97316'  // Bright Tangerine
      ];

      causeChartInstance = new Chart(canvas, {
        type: 'doughnut',
        data: {
          labels,
          datasets: [{
            data: values,
            backgroundColor: labels.map((_, idx) => palette[idx % palette.length]),
            borderColor: '#FFFFFF',
            borderWidth: 3,
            hoverOffset: 8
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          cutout: '66%',
          plugins: {
            legend: {
              position: 'bottom',
              labels: {
                usePointStyle: true,
                pointStyle: 'circle',
                padding: 14,
                font: { family: 'Inter', size: 12, weight: '500' },
                color: '#1E293B'
              }
            },
            tooltip: {
              backgroundColor: '#1E293B',
              titleFont: { family: 'Plus Jakarta Sans', size: 13, weight: '700' },
              bodyFont: { family: 'Inter', size: 12 },
              padding: 12,
              cornerRadius: 12,
              callbacks: {
                label: (ctx) => {
                  const total = ctx.dataset.data.reduce((a, b) => a + b, 0);
                  const pct = total > 0 ? Math.round((ctx.raw / total) * 100) : 0;
                  return ` ${ctx.label}: ${ctx.raw} (${pct}%)`;
                }
              }
            }
          }
        }
      });
    }

    function renderRegionalAllocation(items) {
      const container = document.getElementById('regionalBreakdownList');
      if (!container) return;

      // Aggregate funding & count by region/country
      const regionMap = {};
      items.forEach(item => {
        const locParts = item.location.split(/[,•]/).map(s => s.trim()).filter(Boolean);
        const region = locParts[locParts.length - 1] || 'Global';
        if (!regionMap[region]) {
          regionMap[region] = { name: region, raised: 0, count: 0 };
        }
        regionMap[region].count += 1;
        if (item.funding) {
          regionMap[region].raised += item.funding.raised;
        }
      });

      const sortedRegions = Object.values(regionMap)
        .sort((a, b) => (b.raised - a.raised) || (b.count - a.count))
        .slice(0, 5);

      const maxMetric = Math.max(...sortedRegions.map(r => r.raised || r.count), 1);

      container.innerHTML = sortedRegions.map((reg, idx) => {
        const value = reg.raised > 0 ? reg.raised : reg.count;
        const pct = Math.max(12, Math.round((value / maxMetric) * 100));
        const barColors = [
          'from-coral to-[#FF8A4C]',
          'from-amberWarm to-[#FFCC4D]',
          'from-mint to-emerald-400',
          'from-sky-400 to-blue-500',
          'from-rose-400 to-pink-500'
        ];
        const colorClass = barColors[idx % barColors.length];

        return `
          <div class="space-y-1.5">
            <div class="flex items-center justify-between text-xs">
              <span class="font-bold text-charcoal flex items-center gap-1.5">
                <span>${escapeHtml(reg.name)}</span>
                <span class="px-1.5 py-0.5 rounded-md bg-ivoryDark text-[10px] font-semibold text-charcoal-muted">
                  ${reg.count} ${reg.count === 1 ? 'org' : 'orgs'}
                </span>
              </span>
              <span class="font-bold text-charcoal">
                ${reg.raised > 0 ? '$' + reg.raised.toLocaleString() : reg.count + ' Active'}
              </span>
            </div>
            <div class="w-full h-2.5 rounded-full bg-ivoryDark overflow-hidden p-0.5 border border-orange-100/80">
              <div class="h-full rounded-full bg-gradient-to-r ${colorClass} transition-all duration-700" style="width: ${pct}%"></div>
            </div>
          </div>
        `;
      }).join('');
    }

    // =========================================================================
    // 7. FILTERING & RENDERING CARDS WITH STAGGERED FLY-IN
    // =========================================================================
    function getFilteredItems() {
      return state.items.filter(item => {
        // Source Filter
        if (state.sourceFilter !== 'all' && item.source !== state.sourceFilter) {
          return false;
        }
        // Category Filter
        if (state.categoryFilter !== 'All') {
          const catLower = state.categoryFilter.toLowerCase();
          const inCategory = item.category.toLowerCase().includes(catLower);
          const inTags = item.tags.some(t => t.toLowerCase().includes(catLower));
          const inText = item.title.toLowerCase().includes(catLower) || item.summary.toLowerCase().includes(catLower);
          if (!inCategory && !inTags && !inText) return false;
        }
        // Search Query
        if (state.searchQuery.trim() !== '') {
          const q = state.searchQuery.toLowerCase().trim();
          const searchable = `${item.title} ${item.subtitle} ${item.location} ${item.category} ${item.summary} ${item.tags.join(' ')}`.toLowerCase();
          if (!searchable.includes(q)) return false;
        }
        return true;
      });
    }

    function updateTabCounts() {
      // Calculate counts based on current category + search query (ignoring sourceFilter)
      const baseFiltered = state.items.filter(item => {
        if (state.categoryFilter !== 'All') {
          const catLower = state.categoryFilter.toLowerCase();
          const matchCat = item.category.toLowerCase().includes(catLower)
            || item.tags.some(t => t.toLowerCase().includes(catLower))
            || item.summary.toLowerCase().includes(catLower);
          if (!matchCat) return false;
        }
        if (state.searchQuery.trim() !== '') {
          const q = state.searchQuery.toLowerCase().trim();
          const searchable = `${item.title} ${item.subtitle} ${item.location} ${item.category} ${item.summary} ${item.tags.join(' ')}`.toLowerCase();
          if (!searchable.includes(q)) return false;
        }
        return true;
      });

      const everyCount = baseFiltered.filter(i => i.source === 'every').length;
      const ggCount = baseFiltered.filter(i => i.source === 'globalgiving').length;

      document.getElementById('count-all').textContent = baseFiltered.length;
      document.getElementById('count-every').textContent = everyCount;
      document.getElementById('count-gg').textContent = ggCount;
    }

    async function renderFilteredCards(withFlyOut = true) {
      const grid = document.getElementById('cardsGrid');
      const emptyState = document.getElementById('emptyState');
      const summary = document.getElementById('resultsSummary');

      updateTabCounts();
      const filtered = getFilteredItems();

      // Smooth Fly-Out before replacing cards
      if (withFlyOut && grid.children.length > 0) {
        grid.classList.add('grid-fly-out');
        await new Promise(r => setTimeout(r, 240));
        grid.classList.remove('grid-fly-out');
      }

      grid.innerHTML = '';

      if (filtered.length === 0) {
        emptyState.classList.remove('hidden');
        summary.textContent = '0 results found';
        return;
      }

      emptyState.classList.add('hidden');
      summary.textContent = `Showing ${filtered.length} ${filtered.length === 1 ? 'initiative' : 'initiatives'}`;

      filtered.forEach((item, index) => {
        const card = createCardElement(item, index);
        grid.appendChild(card);
        cardObserver.observe(card);
      });

      lucide.createIcons();
    }

              <i data-lucide="map-pin" class="w-3.5 h-3.5 text-amberWarm"></i>
              ${escapeHtml(item.location)}
            </span>
            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-white/90 text-charcoal backdrop-blur-xs">
              ID: ${escapeHtml(item.ein || item.projectId || item.id)}
            </span>
          </div>
        </div>

        <!-- Title & Organization -->
        <div>
          <h2 class="font-display font-extrabold text-2xl sm:text-3xl text-charcoal leading-tight">
            ${escapeHtml(item.title)}
          </h2>
          <p class="text-sm font-semibold text-coral mt-1">
            ${escapeHtml(item.subtitle)}
          </p>
        </div>

        <!-- Metrics / Verification Box -->
        ${metricsBlock}

        <!-- Mission Overview -->
        <div class="space-y-2.5">
          <h3 class="font-display font-bold text-base text-charcoal flex items-center gap-2">
            <i data-lucide="sparkles" class="w-4 h-4 text-amberWarm"></i>
            Mission &amp; Impact Overview
          </h3>
          <p class="text-sm sm:text-base text-charcoal-muted leading-relaxed whitespace-pre-line">
            ${escapeHtml(item.fullMission)}
          </p>
        </div>

        <!-- Cause Tags -->
        <div class="space-y-2">
          <span class="text-xs font-bold uppercase tracking-wider text-charcoal-muted block">Cause Areas</span>
          <div class="flex flex-wrap gap-2">
            ${item.tags.map(tag => `
              <span class="px-3 py-1.5 rounded-full text-xs font-semibold bg-ivory border border-orange-200/70 text-charcoal">
                #${escapeHtml(tag)}
              </span>
            `).join('')}
          </div>
        </div>
      `;

      // Footer Direct External Action Button
      footer.innerHTML = `
        <button onclick="closeDetailDrawer()" class="px-4 py-3 rounded-xl border border-orange-200 bg-white text-charcoal text-xs sm:text-sm font-bold hover:bg-ivoryDark transition-colors cursor-pointer">
          Close
        </button>
        <a 
          href="${escapeHtml(item.actionUrl)}" 
          target="_blank" 
          rel="noopener noreferrer"
          class="flex-1 py-3.5 px-6 rounded-xl bg-gradient-to-r ${
            isEvery 
              ? 'from-coral to-[#FF834A] hover:from-coral-hover hover:to-coral shadow-coral/25' 
              : 'from-amberWarm to-[#FF8C24] hover:from-amberWarm-dark hover:to-amberWarm shadow-amberWarm/25'
          } text-white font-bold text-sm sm:text-base shadow-lg active:scale-98 transition-all flex items-center justify-center gap-2">
          <span>${isEvery ? 'Donate on Every.org' : 'Fund on GlobalGiving'}</span>
          <i data-lucide="external-link" class="w-4 h-4"></i>
        </a>
      `;

      lucide.createIcons();

      // Trigger Fly-In Animation
      drawer.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
      requestAnimationFrame(() => {
        backdrop.classList.remove('opacity-0');
        backdrop.classList.add('opacity-100');
        panel.classList.remove('detail-panel-transform-closed');
        panel.classList.add('detail-panel-transform-open');
      });
    }

    function closeDetailDrawer() {
      const drawer = document.getElementById('detailDrawer');
      if (drawer.classList.contains('hidden')) return;

      const backdrop = document.getElementById('detailBackdrop');
      const panel = document.getElementById('detailPanel');

      backdrop.classList.remove('opacity-100');
      backdrop.classList.add('opacity-0');
      panel.classList.remove('detail-panel-transform-open');
      panel.classList.add('detail-panel-transform-closed');

      setTimeout(() => {
        drawer.classList.add('hidden');
        document.body.style.overflow = '';
      }, 360);
    }

    function shareCurrentItem() {
      if (!state.selectedItem) return;
      const shareText = `${state.selectedItem.title} — ${state.selectedItem.actionUrl}`;
      
      // Use reliable textarea fallback for clipboard copying
      const textArea = document.createElement('textarea');
      textArea.value = shareText;
      textArea.style.position = 'fixed';
      textArea.style.left = '-9999px';
      document.body.appendChild(textArea);
      textArea.select();
      try {
        document.execCommand('copy');
        showToast('Project link copied to clipboard!', 'check-circle-2');
      } catch (err) {
        showToast('Unable to copy link', 'alert-circle');
      }
      document.body.removeChild(textArea);
    }

    // =========================================================================
    // 8. API KEYS SETTINGS DRAWER LOGIC
    // =========================================================================
    function openApiDrawer() {
      const drawer = document.getElementById('apiDrawer');
      const backdrop = document.getElementById('apiBackdrop');
      const panel = document.getElementById('apiPanel');

      // Populate inputs with stored state
      document.getElementById('everyApiKeyInput').value = state.everyApiKey;
      document.getElementById('ggApiKeyInput').value = state.ggApiKey;
      selectModeInDrawer(state.mode);

      drawer.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
      requestAnimationFrame(() => {
        backdrop.classList.remove('opacity-0');
        backdrop.classList.add('opacity-100');
        panel.classList.remove('detail-panel-transform-closed');
        panel.classList.add('detail-panel-transform-open');
      });
    }

    function closeApiDrawer() {
      const drawer = document.getElementById('apiDrawer');
      if (drawer.classList.contains('hidden')) return;

      const backdrop = document.getElementById('apiBackdrop');
      const panel = document.getElementById('apiPanel');

      backdrop.classList.remove('opacity-100');
      backdrop.classList.add('opacity-0');
      panel.classList.remove('detail-panel-transform-open');
      panel.classList.add('detail-panel-transform-closed');

      setTimeout(() => {
        drawer.classList.add('hidden');
        document.body.style.overflow = '';
      }, 360);
    }

    function selectModeInDrawer(mode) {
      state.drawerDraftMode = mode;
      const btnDemo = document.getElementById('btnModeDemo');
      const btnLive = document.getElementById('btnModeLive');
      const pill = document.getElementById('drawerModePill');

      if (mode === 'demo') {
        btnDemo.className = 'py-2.5 px-3 rounded-xl text-xs font-bold border border-amberWarm bg-amberWarm text-white shadow-sm transition-all cursor-pointer';
        btnLive.className = 'py-2.5 px-3 rounded-xl text-xs font-bold border border-orange-200 bg-white text-charcoal-muted hover:text-charcoal transition-all cursor-pointer';
        pill.textContent = 'Demo Showcase';
        pill.className = 'px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-amberWarm/20 text-amberWarm-dark';
      } else {
        btnLive.className = 'py-2.5 px-3 rounded-xl text-xs font-bold border border-mint bg-mint text-white shadow-sm transition-all cursor-pointer';
        btnDemo.className = 'py-2.5 px-3 rounded-xl text-xs font-bold border border-orange-200 bg-white text-charcoal-muted hover:text-charcoal transition-all cursor-pointer';
        pill.textContent = 'Live API Mode';
        pill.className = 'px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-mint-light text-mint';
      }
    }

    function saveApiSettings() {
      const everyVal = document.getElementById('everyApiKeyInput').value.trim();
      const ggVal = document.getElementById('ggApiKeyInput').value.trim();

      state.everyApiKey = everyVal;
      state.ggApiKey = ggVal;
      state.mode = state.drawerDraftMode;

      localStorage.setItem('ki_every_key', everyVal);
      localStorage.setItem('ki_gg_key', ggVal);
      localStorage.setItem('ki_mode', state.mode);

      syncHeaderModeUI();
      closeApiDrawer();
      loadData(true);
      showToast(`Switched to ${state.mode === 'live' ? 'Live API Mode' : 'Demo Showcase Mode'}`, 'check-circle-2');
    }

    function clearStoredKeys() {
      document.getElementById('everyApiKeyInput').value = '';
      document.getElementById('ggApiKeyInput').value = '';
      localStorage.removeItem('ki_every_key');
      localStorage.removeItem('ki_gg_key');
      state.everyApiKey = '';
      state.ggApiKey = '';
      selectModeInDrawer('demo');
      showToast('Saved API keys cleared', 'trash-2');
    }

    function syncHeaderModeUI() {
      const badge = document.getElementById('headerModeBadge');
      const dot = document.getElementById('modeDot');
      const label = document.getElementById('modeLabel');

      if (state.mode === 'live') {
        badge.className = 'flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-semibold border transition-all cursor-pointer bg-mint-light border-mint/30 text-mint hover:bg-mint/15';
        dot.className = 'w-2 h-2 rounded-full bg-mint animate-pulse';
        label.textContent = 'Live APIs';
      } else {
        badge.className = 'flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-semibold border transition-all cursor-pointer bg-amberWarm-light border-amberWarm/30 text-amberWarm-dark hover:bg-amberWarm/15';
        dot.className = 'w-2 h-2 rounded-full bg-amberWarm animate-pulse';
        label.textContent = 'Demo Showcase';
      }
    }

    // =========================================================================
    // 9. UTILITIES (TOASTS & XSS ESCAPING)
    // =========================================================================
    function showToast(message, iconName = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = 'toast-enter pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-2xl bg-charcoal text-white text-xs sm:text-sm font-semibold shadow-warm-lg border border-white/10';
      toast.innerHTML = `
        <i data-lucide="${iconName}" class="w-4 h-4 text-amberWarm shrink-0"></i>
        <span>${escapeHtml(message)}</span>
      `;
      container.appendChild(toast);
      lucide.createIcons();

      setTimeout(() => {
        toast.classList.remove('toast-enter');
        toast.classList.add('toast-exit');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
